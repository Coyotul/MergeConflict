          type: string
          title: Turn Id
        session_version:
          type: integer
          title: Session Version
        messages:
          items:
            $ref: '#/components/schemas/ChatMessageView'
          type: array
          title: Messages
        awaiting:
          $ref: '#/components/schemas/Awaiting'
        progress:
          $ref: '#/components/schemas/Progress'
        blocks:
          items:
            oneOf:
            - $ref: '#/components/schemas/DocumentChecklistBlock'
            - $ref: '#/components/schemas/ExtractedFieldsBlock'
            - $ref: '#/components/schemas/EligibilityResultBlock'
            - $ref: '#/components/schemas/OffersBlock'
            - $ref: '#/components/schemas/ApplicationSummaryBlock'
            - $ref: '#/components/schemas/ApplicationSubmittedBlock'
            - $ref: '#/components/schemas/EscalationBlock'
            discriminator:
              propertyName: type
              mapping:
                application_submitted: '#/components/schemas/ApplicationSubmittedBlock'
                application_summary: '#/components/schemas/ApplicationSummaryBlock'
                document_checklist: '#/components/schemas/DocumentChecklistBlock'
                eligibility_result: '#/components/schemas/EligibilityResultBlock'
                escalation: '#/components/schemas/EscalationBlock'
                extracted_fields: '#/components/schemas/ExtractedFieldsBlock'
                offers: '#/components/schemas/OffersBlock'
